<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Toy Car</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

    <div class="car">

        <div class="spoiler"></div>

        <div class="body">

            <div class="hood">
                <div class="led-strip"></div>
            </div>

            <div class="windshield"></div>

            <div class="mirror left"></div>
            <div class="mirror right"></div>

            <div class="headlight left">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="headlight right">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="bumper"></div>

        </div>

        <div class="wheel front"></div>
        <div class="wheel rear"></div>

    </div>

    <div class="remote">
        <div class="display"></div>
        <div class="buttons"></div>
    </div>

</div>

<button id="toggleLights">Toggle Lights</button>

<script src="script.js"></script>

</body>
</html>
