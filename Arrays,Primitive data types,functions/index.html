<!DOCTYPE html>
<html>
<head>
    <title>JS Program - Arrays, Functions, Primitive Types</title>
</head>
<body>

<h2>Check Console Output</h2>
<p>Right click → Inspect → Console</p>

<script>
// ===============================
// PRIMITIVE TYPES
// ===============================
let name = "Preetha";   // String
let age = 20;           // Number
let isStudent = true;   // Boolean
let address;            // Undefined
let phone = null;       // Null

console.log("=== Primitive Types ===");
console.log("Name:", name);
console.log("Age:", age);
console.log("Is Student:", isStudent);
console.log("Address:", address);
console.log("Phone:", phone);


// ===============================
// ARRAYS
// ===============================
let marks = [85, 90, 78, 88, 92];

console.log("\n=== Array Values ===");
console.log("Marks:", marks);

// Access elements
console.log("First mark:", marks[0]);

// Add element
marks.push(95);
console.log("After adding mark:", marks);

// Remove element
marks.pop();
console.log("After removing last mark:", marks);


// ===============================
// FUNCTIONS
// ===============================

// Function to calculate total
function calculateTotal(arr) {
    let total = 0;
    for (let i = 0; i < arr.length; i++) {
        total += arr[i];
    }
    return total;
}

// Function to calculate average
function calculateAverage(arr) {
    let total = calculateTotal(arr);
    return total / arr.length;
}

// Arrow function
const displayResult = (avg) => {
    console.log("Average Marks:", avg);
};


// ===============================
// FUNCTION CALLING
// ===============================
let totalMarks = calculateTotal(marks);
let averageMarks = calculateAverage(marks);

console.log("\n=== Function Output ===");
console.log("Total Marks:", totalMarks);
displayResult(averageMarks);

</script>

</body>
</html>
